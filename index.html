    // --- DASHBOARD VIEW ---
    function DashboardView({ landParcels, searchQuery, onNavigate, onSelectCert }) {
      const filtered = landParcels.filter(p => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return p.title.toLowerCase().includes(q) || p.lga.toLowerCase().includes(q) || p.beacons.some(b => b.toLowerCase().includes(q));
      });

      const approvedCount = landParcels.filter(p => p.status === 'Approved').length;
      const pendingCount = landParcels.filter(p => p.status !== 'Approved').length;
      const totalSqm = landParcels.reduce((acc, p) => acc + p.landSizeSqm, 0);

      return (
        <div className="space-y-6">
          {/* Welcome Card */}
          <div className="bg-gradient-to-r from-slate-900 via-slate-900 to-emerald-950 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
              <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
              <span>Official Cadastral Gateway</span>
            </div>
            <h1 className="text-2xl font-bold text-white">GeoEase Cadastral Dashboard</h1>
            <p className="text-xs text-slate-300 max-w-2xl">
              Bypass bureaucratic bottlenecks. Manage C of O land titles, dispatch licensed survey teams, and run Shoelace area matrix calculations natively.
            </p>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-4 border-t border-slate-800">
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 text-[10px]">TOTAL PLOTS</span>
                <p className="text-lg font-bold text-white">{landParcels.length}</p>
              </div>
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 text-[10px]">APPROVED C OF O</span>
                <p className="text-lg font-bold text-emerald-400">{approvedCount}</p>
              </div>
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 text-[10px]">PENDING PIPELINE</span>
                <p className="text-lg font-bold text-amber-400">{pendingCount}</p>
              </div>
              <div className="bg-slate-950/60 p-3 rounded-xl border border-slate-800">
                <span className="text-slate-400 text-[10px]">SURVEYED AREA</span>
                <p className="text-lg font-bold text-sky-400">{(totalSqm/10000).toFixed(2)} ha</p>
              </div>
            </div>

            <h2 className="text-base font-bold text-white">Active Land Registrations ({filtered.length})</h2>

              {filtered.map(parcel => (
                <div key={parcel.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 hover:border-slate-700 transition-all">
                  <div className="flex justify-between items-start border-b border-slate-800 pb-3">
                    <div>
                      <span className="text-xs font-mono text-emerald-400 font-bold">{parcel.id}</span>
                      <h3 className="text-sm font-bold text-white mt-0.5">{parcel.title}</h3>
                      <p className="text-xs text-slate-400">{parcel.lga}, {parcel.state}</p>
                    </div>
                    <span className={`px-2.5 py-1 rounded-full text-[11px] font-semibold ${
                      parcel.status === 'Approved' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                    }`}>
                      {parcel.status}
                    </span>
                  </div>

                  <div className="text-xs text-slate-300 space-y-1">
                    <p>Area: <strong>{parcel.landSizeSqm.toLocaleString()} SQM</strong> ({parcel.acreage} Acres)</p>
                    <p className="font-mono text-[11px]">Beacons: {parcel.beacons.join(', ')}</p>
                  </div>

                  <div className="flex justify-between items-center pt-2">
                    <span className="text-xs text-slate-400">Owner: {parcel.ownerName}</span>
                    {parcel.status === 'Approved' && (
                      <button 
                        onClick={() => onSelectCert(parcel)}
                        className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg"

                    )}

                </div>

    // --- LAND PORTAL VIEW ---

        e.preventDefault();
        const newP = {
          id: `PARCEL-2026-${Math.floor(100 + Math.random() * 900)}`,
          title: formData.title || 'Custom Land Plot',
          landSizeSqm: Number(formData.landSizeSqm),
          acreage: Number((formData.landSizeSqm / 4046.86).toFixed(3)),
          state: formData.state,
          lga: formData.lga,
          address: `${formData.lga}, ${formData.state}`,
          zoning: 'Residential',
          coordinates: { lat: 6.5818, lng: 3.9821 },
          beacons: formData.beaconsText.split(',').map(b => b.trim()),
          status: 'Pending Review',
          registrationDate: new Date().toISOString().split('T')[0],
          ownerName: formData.ownerName,
          applicationProgressPercent: 25,
          documents: [{ id: 'd-new', name: 'Perimeter_Survey_Plan.pdf', type: 'Survey Plan', status: 'Uploaded' }]

        onAddParcel(newP);
        setViewMode('list');

            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setViewMode('list')} 
                className={`px-4 py-2 rounded-xl text-xs font-semibold ${viewMode === 'list' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'}`}
              >
                Applications ({landParcels.length})
              </button>
              <button 
                onClick={() => setViewMode('new')} 
                className={`px-4 py-2 rounded-xl text-xs font-semibold ${viewMode === 'new' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300'}`}
              >
                + New Registration

              <div>
                <label className="block font-semibold text-slate-300 mb-1">Survey Type</label>

              <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1 text-slate-300">

                <div className="flex justify-between"><span>RTK GNSS Setup:</span><span>$45</span></div>
                <div className="flex justify-between font-bold text-emerald-400 text-sm pt-2 border-t border-slate-800">
                  <span>Estimated Total:</span><span>${estimatedTotal}.00</span>
                </div>
              </div>

              <button className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl">

              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- WEATHER & SHOELACE MATRIX VIEW ---
    function WeatherGeoView() {
      const [matrixInput, setMatrixInput] = useState("6.5818, 3.9821\n6.5828, 3.9821\n6.5828, 3.9831\n6.5818, 3.9831");
      const [matrixResult, setMatrixResult] = useState(null);

      const handleCalculateMatrix = () => {
        const lines = matrixInput.trim().split('\n');
        const points = [];
        lines.forEach(l => {
          const parts = l.split(/[\s,]+/).map(n => parseFloat(n)).filter(n => !isNaN(n));
          if (parts.length >= 2) points.push(parts);
        });

        if (points.length < 3) {
          alert('Input at least 3 points.'); return;
        }

        const refLat = points[0][0];
        const latM = 111000;
        const lngM = 111000 * Math.cos((refLat * Math.PI) / 180);
        const proj = points.map(([lat, lng]) => [lng * lngM, lat * latM]);

        let pos = 0, neg = 0, n = proj.length;
        for (let i = 0; i < n; i++) {
          const j = (i + 1) % n;
          pos += proj[i][0] * proj[j][1];
          neg += proj[j][0] * proj[i][1];
        }
        const areaSqm = Math.abs(pos - neg) / 2;

        setMatrixResult({ areaSqm: Math.round(areaSqm), acres: Number((areaSqm/4046.86).toFixed(3)), pointsCount: n });
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <h2 className="text-base font-bold text-white">Shoelace Coordinate Matrix Calculator</h2>
            <p className="text-xs text-slate-400">Paste polygon vertices to compute exact enclosed boundary area using Gauss's Shoelace algorithm.</p>
            <textarea 
              rows={5} value={matrixInput} onChange={e => setMatrixInput(e.target.value)}
              className="w-full bg-slate-950 border border-slate-700 text-emerald-300 font-mono text-xs rounded-xl p-3"
            />
            <button onClick={handleCalculateMatrix} className="w-full py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">
              Compute Matrix Area
            </button>

            {matrixResult && (
              <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-2">
                <p className="font-bold text-emerald-400">Area: {matrixResult.areaSqm.toLocaleString()} SQM</p>
                <p className="text-white">Acreage: {matrixResult.acres} Acres</p>
              </div>
            )}
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <h2 className="text-base font-bold text-white">Atmospheric Telemetry & Drone Flight Safety</h2>
            <div className="p-4 bg-emerald-950/40 rounded-xl border border-emerald-800 text-xs text-emerald-200">
              ✔ LiDAR Drone Survey Flight Authorized • Wind Gusts: 11.2 km/h • Temp: 28.5°C
            </div>
          </div>
        </div>
      );
    }

    // Render App
